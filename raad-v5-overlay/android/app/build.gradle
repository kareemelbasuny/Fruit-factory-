plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.raad.personal'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.raad.personal.v5'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '5.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}