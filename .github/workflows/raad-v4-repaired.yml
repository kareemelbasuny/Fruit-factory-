name: RAAD OS 4 - Android APK (Repaired)
on:
  push:
    branches: [raad-v4-voice]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore RAAD source files
        run: |
          mkdir -p raad-v4-app
          unzip -q raad-v4-bundle/source.zip -d raad-v4-app
          python raad-v4-bundle/repair-v4.py
          test -s raad-v4-app/android/app/src/main/java/ai/raad/personal/DeviceActionHandler.java
          test -s raad-v4-app/android/app/src/main/java/ai/raad/personal/WakeListeningService.java
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: RAAD automated tests
        working-directory: raad-v4-app
        run: npm test
      - name: Bundle offline UI into Android
        working-directory: raad-v4-app
        run: npm run package:android
      - name: Build Android APK
        working-directory: raad-v4-app/android
        run: gradle --no-daemon assembleDebug
      - name: Check APK
        shell: bash
        run: |
          test -s raad-v4-app/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum raad-v4-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug-signed installable RAAD APK
        uses: actions/upload-artifact@v4
        with:
          name: RAAD-OS-v4-Fixed-APK
          path: raad-v4-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
