name: RAAD OS 4 - Voice and Android Actions
on:
  push:
    branches: [raad-v4-voice]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Unpack RAAD OS 4 source
        run: |
          mkdir raad-v4-app
          unzip -q raad-v4-bundle/source.zip -d raad-v4-app
          cp raad-v4-fixes/WakePhrase.java raad-v4-app/android/app/src/main/java/ai/raad/personal/WakePhrase.java
          cp raad-v4-fixes/MainActivity.java raad-v4-app/android/app/src/main/java/ai/raad/personal/MainActivity.java
          test -s raad-v4-app/android/app/src/main/java/ai/raad/personal/WakeListeningService.java
          test -s raad-v4-app/android/app/src/main/java/ai/raad/personal/DeviceActionHandler.java
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run full automated tests
        working-directory: raad-v4-app
        run: npm test
      - name: Build and package offline RAAD app
        working-directory: raad-v4-app
        run: npm run package:android
      - name: Compile installable debug APK
        working-directory: raad-v4-app/android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: |
          test -s raad-v4-app/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum raad-v4-app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RAAD-OS-v4-Voice-APK
          path: raad-v4-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
